# Phase 1 Testing - Manual execution only
name: Claude for GitHub

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode for claude-for-github.yml restoration'
        required: false
        default: 'manual_test'
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - name: Claude for GitHub (Test Mode)
        uses: anthropics/claude-code-action@v0.0.58
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        env:
          TEST_MODE: ${{ github.event.inputs.test_mode }}