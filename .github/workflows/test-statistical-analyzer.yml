name: Test Universal Statistical Analyzer (INCI-004)

on:
  push:
    paths:
      - 'tools/progress_tracker/universal_statistical_analyzer.py'
      - 'tests/unit/test_universal_statistical_analyzer.py'
  pull_request:
    paths:
      - 'tools/progress_tracker/universal_statistical_analyzer.py'
      - 'tests/unit/test_universal_statistical_analyzer.py'
  workflow_dispatch:

jobs:
  test-statistical-analyzer:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", 3.11]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov numpy scipy
        pip install -r requirements.txt
    
    - name: Run BASELINE_ID validation tests
      run: |
        echo "🔬 BASELINE_ID必須バリデーションテスト実行中..."
        python -m pytest tests/unit/test_universal_statistical_analyzer.py::TestUniversalStatisticalAnalyzer::test_baseline_id_required_with_none -v
        python -m pytest tests/unit/test_universal_statistical_analyzer.py::TestUniversalStatisticalAnalyzer::test_baseline_id_required_with_empty_string -v
        python -m pytest tests/unit/test_universal_statistical_analyzer.py::TestUniversalStatisticalAnalyzer::test_baseline_id_required_with_whitespace -v
        python -m pytest tests/unit/test_universal_statistical_analyzer.py::TestUniversalStatisticalAnalyzer::test_baseline_id_valid -v
    
    - name: Run Cohen's d calculation tests
      run: |
        echo "📊 Cohen's d計算精度テスト実行中..."
        python -m pytest tests/unit/test_universal_statistical_analyzer.py::TestUniversalStatisticalAnalyzer::test_cohens_d_calculation_accuracy -v
        python -m pytest tests/unit/test_universal_statistical_analyzer.py::TestUniversalStatisticalAnalyzer::test_glass_delta_calculation -v
        python -m pytest tests/unit/test_universal_statistical_analyzer.py::TestUniversalStatisticalAnalyzer::test_confidence_interval_calculation -v
    
    - name: Run practical significance tests
      run: |
        echo "🎯 実用的意義判定テスト実行中..."
        python -m pytest tests/unit/test_universal_statistical_analyzer.py::TestUniversalStatisticalAnalyzer::test_practical_significance_categories -v
        python -m pytest tests/unit/test_universal_statistical_analyzer.py::TestUniversalStatisticalAnalyzer::test_effect_magnitude_categories -v
    
    - name: Run Google Sheets integration tests
      run: |
        echo "📝 Google Sheets統合テスト実行中..."
        python -m pytest tests/unit/test_universal_statistical_analyzer.py::TestUniversalStatisticalAnalyzer::test_google_sheets_update_success -v
        python -m pytest tests/unit/test_universal_statistical_analyzer.py::TestUniversalStatisticalAnalyzer::test_google_sheets_tracker_not_found -v
    
    - name: Run error handling tests
      run: |
        echo "⚠️  エラーハンドリングテスト実行中..."
        python -m pytest tests/unit/test_universal_statistical_analyzer.py::TestUniversalStatisticalAnalyzer::test_division_by_zero_handling -v
        python -m pytest tests/unit/test_universal_statistical_analyzer.py::TestUniversalStatisticalAnalyzer::test_empty_data_handling -v
    
    - name: Run parametric tests
      run: |
        echo "🧪 パラメトリックテスト実行中..."
        python -m pytest tests/unit/test_universal_statistical_analyzer.py::test_baseline_validation_parametric -v
        python -m pytest tests/unit/test_universal_statistical_analyzer.py::test_effect_magnitude_parametric -v
    
    - name: Run integration tests
      run: |
        echo "🔗 統合テスト実行中..."
        python -m pytest tests/unit/test_universal_statistical_analyzer.py::TestIntegrationScenarios::test_full_workflow_with_mocked_data -v
    
    - name: Generate test coverage report
      run: |
        python -m pytest tests/unit/test_universal_statistical_analyzer.py --cov=tools.progress_tracker.universal_statistical_analyzer --cov-report=html --cov-report=term
    
    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-python-${{ matrix.python-version }}
        path: htmlcov/
    
    - name: Test CLI functionality (integration)
      run: |
        echo "🖥️  CLI機能テスト実行中..."
        # ヘルプ表示テスト
        python tools/progress_tracker/universal_statistical_analyzer.py --help
        
        # 必須引数なしでエラーになることを確認
        ! python tools/progress_tracker/universal_statistical_analyzer.py --current TEST-001 || exit 1
        
        # 空のBASELINE_IDでエラーになることを確認
        ! python tools/progress_tracker/universal_statistical_analyzer.py --current TEST-001 --baseline "" || exit 1
        
        echo "✅ CLI機能テスト完了"
    
    - name: Validate INCI-004 requirements
      run: |
        echo "🔍 INCI-004要件検証中..."
        
        # BASELINE_ID必須化の確認
        grep -q "BASELINE_ID必須" tools/progress_tracker/universal_statistical_analyzer.py || {
          echo "❌ INCI-004要件違反: BASELINE_ID必須バリデーションが見つかりません"
          exit 1
        }
        
        # validate_baseline_required関数の存在確認
        grep -q "def validate_baseline_required" tools/progress_tracker/universal_statistical_analyzer.py || {
          echo "❌ INCI-004要件違反: validate_baseline_required関数が見つかりません"
          exit 1
        }
        
        # Cohen's d統合計算の確認
        grep -q "calculate_enhanced_cohens_d" tools/progress_tracker/universal_statistical_analyzer.py || {
          echo "❌ INCI-004要件違反: 強化版Cohen's d計算が見つかりません"
          exit 1
        }
        
        # Google Sheets統合の確認
        grep -q "update_google_sheets_statistics" tools/progress_tracker/universal_statistical_analyzer.py || {
          echo "❌ INCI-004要件違反: Google Sheets統合機能が見つかりません"
          exit 1
        }
        
        echo "✅ INCI-004要件適合確認完了"
        echo "  - BASELINE_ID必須バリデーション: ✓"
        echo "  - 強化版Cohen's d計算: ✓"
        echo "  - Google Sheets統合: ✓"
        echo "  - Welch t検定実行: ✓"