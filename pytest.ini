[tool:pytest]
# KIRO-006 Phase 2 - Workflow Plan Command System Test Configuration

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test execution
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interaction
    cli: CLI interface tests
    performance: Performance and benchmark tests
    security: Security-related tests
    slow: Tests that take a long time to run
    workflow: Workflow system tests (KIRO-006)
    plan_command: PlanCommandHandler tests
    create_command: CreateCommandHandler tests
    backward_compatibility: Tests ensuring existing functionality works

# Coverage configuration
# Note: Coverage settings can also be in .coveragerc or pyproject.toml
# This is for pytest-cov plugin
--cov-config=.coveragerc

# Filtering
filterwarnings =
    ignore::DeprecationWarning:httplib2.*
    ignore::PendingDeprecationWarning
    ignore::UserWarning:google.*

# Minimum version
minversion = 6.0

# Test timeout (in seconds) - reduced for CI
timeout = 180

# Parallel execution (if pytest-xdist is installed)
# Uncomment the line below if pytest-xdist is installed
# addopts = -n auto