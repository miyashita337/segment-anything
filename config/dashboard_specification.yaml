# ダッシュボード出力仕様書 v1.0
# 完全決定論的出力を保証するための統一規格

specification_version: "1.0.0"
created_date: "2025-08-23"
purpose: "Eliminate output variability and ensure byte-perfect consistency"

# 時刻処理方針
timestamp_policy:
  # 固定時刻を使用（実行時刻に依存しない）
  mode: "fixed"
  fixed_value: "2025-08-23 22:31:24"
  format: "%Y-%m-%d %H:%M:%S"
  
# 数値フォーマット標準化
number_formatting:
  quality_scores:
    decimal_places: 3  # 小数点第3位
    rounding_method: "round"  # round, floor, ceil
  percentages:
    decimal_places: 1
    suffix: "%"
  integers:
    thousand_separator: false
  statistical_values:
    decimal_places: 3  # 統計値も第3位
    
# ソート・順序規則
sorting_rules:
  image_files:
    primary: "filename"
    order: "ascending"
    case_sensitive: false
  quality_categories:
    order: ["高品質", "中品質", "低品質", "要改善"]
    
# HTMLテンプレート構造
template_structure:
  doctype: "<!DOCTYPE html>"
  language: "ja"
  charset: "UTF-8"
  viewport: "width=device-width, initial-scale=1.0"
  
  # CSS/JSライブラリ
  external_libraries:
    tailwind_cdn: "https://cdn.tailwindcss.com"
    
  # 品質バッジ定義
  quality_badges:
    高品質:
      class: "quality-badge-high"
      threshold_min: 0.8
    中品質:
      class: "quality-badge-medium"
      threshold_min: 0.6
      threshold_max: 0.799
    低品質:
      class: "quality-badge-low"
      threshold_min: 0.4
      threshold_max: 0.599
    要改善:
      class: "quality-badge-poor"
      threshold_max: 0.399
      
# コンテンツ生成ルール
content_rules:
  # ヘッダー情報
  header:
    title_format: "{tracker_id} 品質評価ダッシュボード"
    generation_time_label: "生成日時: "
    
  # 統計サマリー
  statistics:
    cards_order: ["総画像数", "平均品質スコア", "成功画像数", "要改善数"]
    color_mapping:
      総画像数: "text-blue-600"
      平均品質スコア: "text-green-600"  
      成功画像数: "text-emerald-600"
      要改善数: "text-red-600"
      
  # 統計分析セクション
  statistical_analysis:
    enabled: true
    title: "📊 統計分析結果"
    use_google_sheets_functions: true
    metrics:
      - key: "p_value"
        label: "p値"
        format: "{value:.3f}"
      - key: "average_quality_score"  
        label: "平均品質スコア"
        format: "{value:.3f}"
      - key: "effect_size"
        label: "効果サイズ"
        format: "{value:.3f}"
      - key: "improvement_rate"
        label: "改善率"
        format: "{value:.1f}%"
      - key: "statistical_significance"
        label: "統計的有意性"
        format: "{value}"
        
  # 画像ギャラリー
  gallery:
    columns: "grid-cols-1 md:grid-cols-2 lg:grid-cols-3"
    image_path_format: "/{tracker_id}/extraction/{filename}"  # 相対パス形式
    base64_embedding: false  # Base64埋め込み無効
    error_handling: 
      show_placeholder: true
      error_message: "画像読み込みエラー<br>{filename}"
    max_height: "max-h-96"
    
# 文字列テンプレート（完全固定）
string_templates:
  page_title: "{tracker_id} - 品質評価ダッシュボード"
  header_title: "{tracker_id} 品質評価ダッシュボード"
  generation_time: "生成日時: {timestamp}"
  image_alt_format: "{filename}"
  quality_score_format: "品質スコア: {score}"
  
# 出力検証ルール
validation_rules:
  file_size_range:
    min_bytes: 4000
    max_bytes: 50000
  required_elements:
    - "<!DOCTYPE html>"
    - "品質評価ダッシュボード" 
    - "総画像数"
    - "平均品質スコア"
  forbidden_elements:
    - "datetime.now()"
    - "random"
    - "undefined"
    - "null"