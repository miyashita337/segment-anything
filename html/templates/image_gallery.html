<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TRACKER_ID}} - 画像ギャラリー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .image-item {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .image-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }
        .image-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid #e5e7eb;
        }
        .image-info {
            padding: 12px;
        }
        .image-name {
            font-size: 12px;
            color: #6b7280;
            word-break: break-all;
            line-height: 1.4;
        }
        .no-images {
            text-align: center;
            color: #9ca3af;
            font-size: 18px;
            margin: 60px 0;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .stats {
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #475569;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- ヘッダー -->
    <div class="header">
        <h1 class="text-3xl font-bold mb-2">📷 {{TRACKER_ID}}</h1>
        <p class="text-xl opacity-90">抽出結果画像ギャラリー</p>
    </div>

    <!-- 統計情報 -->
    <div class="stats">
        <div class="stat-item">
            <span class="text-2xl">🖼️</span>
            <span class="font-semibold">{{IMAGE_COUNT}}</span>
            <span>枚の画像</span>
        </div>
        <div class="stat-item">
            <span class="text-2xl">📁</span>
            <span>extraction/</span>
        </div>
        <div class="stat-item">
            <span class="text-2xl">✨</span>
            <span>WebP対応</span>
        </div>
    </div>

    <!-- 画像ギャラリー -->
    <div class="container mx-auto">
        {{#if HAS_IMAGES}}
        <div class="image-gallery">
            {{IMAGE_GALLERY_CONTENT}}
        </div>
        {{else}}
        <div class="no-images">
            <div class="text-6xl mb-4">📷</div>
            <p class="text-xl font-semibold mb-2">抽出画像が見つかりません</p>
            <p>extraction/ ディレクトリに画像ファイルがありません</p>
            <div class="mt-4 text-sm text-gray-500">
                対応形式: JPG, PNG, WebP, GIF, BMP, SVG
            </div>
        </div>
        {{/if}}
    </div>

    <!-- フッター -->
    <footer class="text-center py-8 text-gray-500 text-sm border-t border-gray-200 mt-8">
        <p>統合ダッシュボードシステム - 実ファイル名ベース表示</p>
    </footer>

    <script>
        // 画像遅延読み込み
        document.addEventListener('DOMContentLoaded', function() {
            const images = document.querySelectorAll('img[loading="lazy"]');
            
            // 画像読み込みエラー処理
            images.forEach(img => {
                img.addEventListener('error', function() {
                    this.parentElement.innerHTML = `
                        <div class="flex items-center justify-center h-48 bg-gray-100 text-gray-400">
                            <div class="text-center">
                                <div class="text-3xl mb-2">❌</div>
                                <div class="text-sm">読み込みエラー</div>
                            </div>
                        </div>
                    `;
                });
                
                img.addEventListener('load', function() {
                    this.classList.add('opacity-100');
                });
            });

            // 画像クリックで拡大表示
            images.forEach(img => {
                img.style.cursor = 'zoom-in';
                img.addEventListener('click', function() {
                    const overlay = document.createElement('div');
                    overlay.className = 'fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50';
                    overlay.innerHTML = `
                        <div class="relative max-w-4xl max-h-full p-4">
                            <img src="${this.src}" class="max-w-full max-h-full object-contain">
                            <button class="absolute top-4 right-4 text-white text-2xl hover:text-gray-300 bg-black bg-opacity-50 rounded-full w-10 h-10 flex items-center justify-center">&times;</button>
                        </div>
                    `;
                    
                    document.body.appendChild(overlay);
                    
                    overlay.addEventListener('click', function(e) {
                        if (e.target === overlay || e.target.tagName === 'BUTTON') {
                            document.body.removeChild(overlay);
                        }
                    });
                });
            });
        });
    </script>
</body>
</html>
